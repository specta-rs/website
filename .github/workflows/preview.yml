name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Start from no permissions and grant the minimum each job needs.
permissions: {}

jobs:
  preview-build:
    # Secrets are not available to workflows triggered by forked pull requests,
    # Dependabot runs get a read-only token, and unreviewed fork code should not
    # be deployed to our account.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-build
          path: doc_build
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          # Only the deploy job in this run needs it.
          retention-days: 1

  preview-deploy:
    needs: preview-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Cloudflare token is released to this job only after the build has
    # succeeded, and the job never executes repository build scripts.
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    outputs:
      url: ${{ steps.preview.outputs.url }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-build
          path: doc_build

      - name: Publish preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Machine-readable output; `--json` still prints upload progress to
          # stdout, so parse this file instead of the command's output.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          set -euo pipefail
          pnpm exec wrangler preview \
            --name "pr-$PR_NUMBER" \
            --worker-name specta-website \
            --message "PR #$PR_NUMBER @ ${GITHUB_SHA:0:12}"

          url="$(jq -sr '[.[] | select(.type == "preview") | .preview_urls[]?] | last // ""' \
            "$WRANGLER_OUTPUT_FILE_PATH")"

          if [ -z "$url" ]; then
            echo "::error::The preview was deployed but Cloudflare returned no URL. Preview URLs must be enabled on the Worker; the production deploy applies 'preview_urls': true." >&2
            exit 1
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"

  preview-comment:
    needs: preview-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This job never runs repository code, so it is the only one that gets
    # permission to write to the pull request.
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ needs.preview-deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- cloudflare-preview -->";
            const body = [
              marker,
              "### Cloudflare preview",
              "",
              `**${process.env.PREVIEW_URL}**`,
              "",
              `Commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\` · updated on every push to this pull request.`,
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  preview-cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request ref is deleted when an unmerged pull request
          # closes, so read the configuration from the base branch instead.
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Delete preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/specta-website/previews/pr-$PR_NUMBER"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")"

          case "$status" in
            200)
              pnpm exec wrangler preview delete \
                --name "pr-$PR_NUMBER" \
                --worker-name specta-website \
                --skip-confirmation
              ;;
            404)
              echo "No preview exists for PR #$PR_NUMBER."
              ;;
            *)
              echo "Unexpected Cloudflare API response for the preview: HTTP $status" >&2
              exit 1
              ;;
          esac
