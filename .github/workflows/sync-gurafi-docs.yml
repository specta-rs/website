name: Sync Gurafi docs

# Docs live in specta-rs/gurafi. Rather than have that repository dispatch a
# workflow here (which needs a cross-repository token), this repository pulls
# the public source on a schedule. The only credential used is the workflow's
# own GITHUB_TOKEN, scoped to this repository by GitHub.
on:
  schedule:
    # GitHub's scheduler is best effort; expect a few minutes of drift.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Gurafi branch, tag or commit SHA
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: sync-gurafi-docs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Gurafi docs
        env:
          REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          # Anonymous clone: Gurafi is public, and GITHUB_TOKEN cannot read
          # another repository even when it is public.
          git init --quiet .gurafi
          git -C .gurafi remote add origin https://github.com/specta-rs/gurafi.git
          git -C .gurafi fetch --quiet --depth 1 origin "$REF"
          git -C .gurafi checkout --quiet FETCH_HEAD

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync docs into content/docs/gurafi
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C .gurafi rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          node scripts/sync-gurafi-docs.mjs --source .gurafi/docs --ref main

      - name: Commit and push
        run: |
          git config user.name "specta-rs docs bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/docs/gurafi public/assets/gurafi-favicon.ico public/assets/gurafi-favicon.svg theme/gurafi-icon.ts
          if git diff --cached --quiet; then
            echo "Gurafi docs are already up to date."
            exit 0
          fi
          git commit -m "Sync Gurafi docs from ${SOURCE_SHA:0:12}"
          git push
