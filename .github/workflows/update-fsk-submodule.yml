name: Update FSK docs submodule

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fsk-submodule
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v7
        with:
          # A `DOCS_SYNC_TOKEN` is only needed if the push should start other
          # workflows; the repository token can commit the submodule bump on its
          # own, so the bump does not stop when that secret is absent.
          token: ${{ secrets.DOCS_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          submodules: recursive

      - name: Update FSK submodule
        id: update
        run: |
          set -euo pipefail
          OLD="$(git -C docs-sources/fsk rev-parse HEAD)"
          git -C docs-sources/fsk fetch --depth 1 origin main
          NEW="$(git -C docs-sources/fsk rev-parse FETCH_HEAD)"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

          if [ "$OLD" = "$NEW" ]; then
            echo "FSK is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git -C docs-sources/fsk diff --quiet "$OLD" "$NEW" -- docs; then
            echo "FSK changed, but docs/ did not."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C docs-sources/fsk checkout --detach "$NEW"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "specta-rs docs bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs-sources/fsk

          if git diff --cached --quiet; then
            echo "The submodule is already up to date."
            exit 0
          fi

          git commit -m "Update FSK docs submodule to ${UPDATE_NEW:0:12}"
          git push
        env:
          UPDATE_NEW: ${{ steps.update.outputs.new }}
