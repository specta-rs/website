name: Update FSK docs submodule

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-fsk-submodule
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Update FSK submodule
        id: update
        run: |
          set -euo pipefail
          OLD="$(git -C docs-sources/fsk rev-parse HEAD)"
          git -C docs-sources/fsk fetch --depth 1 origin main
          NEW="$(git -C docs-sources/fsk rev-parse FETCH_HEAD)"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

          if [ "$OLD" = "$NEW" ]; then
            echo "FSK is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git -C docs-sources/fsk diff --quiet "$OLD" "$NEW" -- docs; then
            echo "FSK changed, but docs/ did not."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C docs-sources/fsk checkout --detach "$NEW"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "specta-rs docs bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs-sources/fsk

          if git diff --cached --quiet; then
            echo "The submodule is already up to date."
            exit 0
          fi

          git commit -m "Update FSK docs submodule to ${UPDATE_NEW:0:12}"
          git push --force origin "$BRANCH"
        env:
          UPDATE_NEW: ${{ steps.update.outputs.new }}
          BRANCH: bot/update-fsk-docs

      - name: Open or update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_NEW: ${{ steps.update.outputs.new }}
          BRANCH: bot/update-fsk-docs
        run: |
          set -euo pipefail
          body="$(printf 'Updates the FSK docs submodule to %s.\nhttps://github.com/specta-rs/fsk/commit/%s\n\nMerging this pull request deploys the site.\n' "${UPDATE_NEW:0:12}" "$UPDATE_NEW")"
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Update FSK docs submodule" \
              --body "$body"
          fi

      # Events caused by `GITHUB_TOKEN` do not start other workflows, so the
      # pull request would otherwise wait forever for its required `build`
      # check. `workflow_dispatch` is exempt from that restriction.
      - name: Run CI on the update branch
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: bot/update-fsk-docs
        run: gh workflow run ci.yml --ref "$BRANCH"
