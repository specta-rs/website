name: Update Gurafi docs submodule

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gurafi-submodule
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v7
        with:
          # A `DOCS_SYNC_TOKEN` is only needed if the push should start other
          # workflows; the repository token can commit the synced docs on its
          # own, so the sync does not stop when that secret is absent.
          token: ${{ secrets.DOCS_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          submodules: recursive

      - name: Update Gurafi submodule
        id: update
        run: |
          set -euo pipefail
          OLD="$(git -C docs-sources/gurafi rev-parse HEAD)"
          git -C docs-sources/gurafi fetch --depth 1 origin main
          NEW="$(git -C docs-sources/gurafi rev-parse FETCH_HEAD)"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

          if [ "$OLD" = "$NEW" ]; then
            echo "Gurafi is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git -C docs-sources/gurafi diff --quiet "$OLD" "$NEW" -- docs; then
            echo "Gurafi changed, but docs/ did not."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C docs-sources/gurafi checkout --detach "$NEW"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Sync docs
        if: steps.update.outputs.changed == 'true'
        run: node scripts/sync-gurafi-docs.mjs --source docs-sources/gurafi/docs --ref main

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "specta-rs docs bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs-sources/gurafi content/docs/gurafi

          if git diff --cached --quiet; then
            echo "Synced docs are already up to date."
            exit 0
          fi

          git commit -m "Update Gurafi docs submodule to ${UPDATE_NEW:0:12}"
          git push
        env:
          UPDATE_NEW: ${{ steps.update.outputs.new }}
