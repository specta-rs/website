name: Update Gurafi docs submodule

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-gurafi-submodule
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A `DOCS_SYNC_TOKEN` is only needed if the pull request should run
          # workflows. Pull requests opened with the repository token do not
          # trigger them, so add a fine-grained PAT with contents and pull
          # request write access to get CI and previews on the update PR.
          token: ${{ secrets.DOCS_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Update Gurafi submodule
        id: update
        run: |
          set -euo pipefail
          OLD="$(git -C docs-sources/gurafi rev-parse HEAD)"
          git -C docs-sources/gurafi fetch --depth 1 origin main
          NEW="$(git -C docs-sources/gurafi rev-parse FETCH_HEAD)"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

          if [ "$OLD" = "$NEW" ]; then
            echo "Gurafi is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git -C docs-sources/gurafi diff --quiet "$OLD" "$NEW" -- docs; then
            echo "Gurafi changed, but docs/ did not."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C docs-sources/gurafi checkout --detach "$NEW"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "specta-rs docs bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs-sources/gurafi

          if git diff --cached --quiet; then
            echo "The submodule is already up to date."
            exit 0
          fi

          git commit -m "Update Gurafi docs submodule to ${UPDATE_NEW:0:12}"
          git push --force origin "$BRANCH"
        env:
          UPDATE_NEW: ${{ steps.update.outputs.new }}
          BRANCH: bot/update-gurafi-docs

      - name: Open or update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          UPDATE_NEW: ${{ steps.update.outputs.new }}
          BRANCH: bot/update-gurafi-docs
        run: |
          set -euo pipefail
          body="$(printf 'Updates the Gurafi docs submodule to %s.\nhttps://github.com/specta-rs/gurafi/commit/%s\n\nMerging this pull request deploys the site.\n' "${UPDATE_NEW:0:12}" "$UPDATE_NEW")"
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Update Gurafi docs submodule" \
              --body "$body"
          fi
