name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm format:check

      - run: pnpm typecheck

      # Build the Cloudflare target so the adapter and
      # `scripts/patch-cloudflare-wrangler.mjs` are exercised the same way the
      # deploy is.
      - run: pnpm build
        env:
          CLOUDFLARE: "1"
