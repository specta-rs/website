name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs can be cancelled, but a run on `main` may be
  # deploying, so let it finish and keep production deploys in order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Start from no permissions and grant the minimum each job needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gurafi, FSK and Besu docs are generated from these submodules during
          # the build.
          submodules: recursive
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm format:check

      - run: pnpm typecheck

      # Build the static site and the Cloudflare Worker bundle.
      - run: pnpm build

      # Validate the Worker/assets configuration without deploying.
      - run: pnpm exec wrangler deploy --dry-run

      # The deploy job publishes exactly the assets this job validated.
      - name: Upload build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-build
          path: doc_build
          # `public/.well-known` is part of the deployed site.
          include-hidden-files: true
          # Allow re-running a failed workflow with the same artifact name.
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requires approval via the protection rules on the `production`
    # environment before the Cloudflare token is released to the job.
    environment:
      name: production
      url: https://specta.dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # Wrangler only needs the Worker source and the built assets, so skip the
      # content generation scripts that `postinstall` normally runs.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: doc-build
          path: doc_build

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: pnpm exec wrangler deploy --message "Deploy ${GITHUB_SHA:0:12}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          set -euo pipefail
          for url in "https://specta.dev/" "https://specta.dev/docs/specta"; do
            curl --fail --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --output /dev/null "$url"
            echo "OK $url"
          done

      # `wrangler deploy` switches traffic before the smoke test runs, so a
      # failed probe leaves the previous version live only after rolling back.
      - name: Roll back if the smoke test fails
        if: failure() && steps.deploy.outcome == 'success'
        continue-on-error: true
        run: pnpm exec wrangler rollback --yes --message "Smoke test failed for ${GITHUB_SHA:0:12}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
