name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Gurafi, FSK and Besu docs are generated from these submodules during
          # the build.
          submodules: recursive

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm format:check

      - run: pnpm typecheck

      # Build the static site and the Cloudflare Worker bundle.
      - run: pnpm build

      # Validate the Worker/assets configuration without deploying.
      - run: pnpm exec wrangler deploy --dry-run
